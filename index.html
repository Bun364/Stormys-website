<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FREE ROBUX</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: black;
      overflow: hidden;
      height: 100vh;
      color: white;
    }

    #bgVideo {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -3;
    }

    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 2px,
          transparent 2px,
          transparent 40px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 2px,
          transparent 2px,
          transparent 40px
        );
      z-index: -2;
    }

    body::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle,
        rgba(255,255,255,0.04) 0%,
        rgba(0,0,0,0.88) 75%
      );
      z-index: -1;
    }

    .screen {
      position: absolute;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .robux-button {
      background: white;
      color: black;
      border: none;
      padding: 35px 70px;
      font-size: 42px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
    }

    .main-text {
      font-size: 70px;
      margin-bottom: 35px;
      text-shadow: 0 0 10px white;
    }

    .sub-text {
      font-size: 30px;
      max-width: 900px;
      line-height: 1.5;
    }

    .floating-text {
      position: absolute;
      bottom: 35px;
      left: 35px;
      font-size: 2rem;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.4;
      animation: float linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); }
      to { transform: translateY(-100vh); }
    }
  </style>
</head>

<body>

  <video autoplay muted loop id="bgVideo">
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- SCREEN 1 -->
  <div class="screen" id="screen1">

    <!-- VISITOR COUNTER (ADDED HERE) -->
    <p style="margin-bottom:20px; font-size:20px; text-shadow:0 0 10px white;">
      Visitors: <span id="visits">0</span>
    </p>

    <button class="robux-button" onclick="showScreen2()">
      CLICK HERE FOR FREE ROBUX
    </button>

  </div>

  <!-- SCREEN 2 -->
  <div class="screen hidden" id="screen2">

    <div class="main-text">
      GOT YOUR IP LOSER XDDD
    </div>

    <button class="robux-button" onclick="showScreen3()"
      style="font-size:28px; padding:20px 50px;">
      CLICK HERE FOR MORE INFO
    </button>

  </div>

  <!-- SCREEN 3 -->
  <div class="screen hidden" id="screen3">

    <div class="floating-text">
      Larp Boy Stormy
    </div>

    <div class="main-text">
      I OWN ALL YALL BITCHES
    </div>

    <div class="sub-text">
      Means I am better than everyone, and all of you are my bitches.
    </div>

  </div>

  <audio id="bgMusic" autoplay loop style="display:none;">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showScreen2() {
      document.getElementById("screen1").classList.add("hidden");
      document.getElementById("screen2").classList.remove("hidden");
    }

    function showScreen3() {
      document.getElementById("screen2").classList.add("hidden");
      document.getElementById("screen3").classList.remove("hidden");
    }

    document.addEventListener("click", () => {
      document.getElementById("bgMusic").play();
    }, { once: true });

    for (let i = 0; i < 90; i++) {
      let particle = document.createElement("div");
      particle.classList.add("particle");
      particle.style.left = Math.random() * 100 + "vw";
      particle.style.animationDuration = (5 + Math.random() * 10) + "s";
      document.body.appendChild(particle);
    }

    /* VISITOR COUNTER SCRIPT (ADDED HERE) */
    fetch("https://api.countapi.xyz/hit/my-github-site-123/visits")
      .then(res => res.json())
      .then(data => {
        document.getElementById("visits").innerText = data.value;
      });
  </script>

</body>
</html>
