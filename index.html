<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FREE ROBUX</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: black;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    /* VIDEO BACKGROUND */

    #bgVideo {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -3;
    }

    /* COOL GRID BACKGROUND */

    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 2px,
          transparent 2px,
          transparent 40px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.02) 0px,
          rgba(255,255,255,0.02) 2px,
          transparent 2px,
          transparent 40px
        );
      z-index: -2;
    }

    /* DARK OVERLAY */

    body::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle,
        rgba(255,255,255,0.03) 0%,
        rgba(0,0,0,0.85) 75%
      );
      z-index: -1;
    }

    .container {
      text-align: center;
      transition: opacity 1.5s ease;
      animation: fadeIn 2s ease;
    }

    /* GLOW BUTTON */

    .robux-button {
      background: white;
      color: black;
      border: none;
      padding: 35px 70px;
      font-size: 42px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow:
        0 0 15px white,
        0 0 35px rgba(255,255,255,0.7),
        0 0 70px rgba(255,255,255,0.3);
      transition: 0.35s ease;
      animation: pulse 2s infinite;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .robux-button:hover {
      transform: scale(1.08);
      background: black;
      color: white;
      border: 2px solid white;
      box-shadow:
        0 0 20px white,
        0 0 60px white;
    }

    /* SHINE EFFECT */

    .robux-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: rgba(255,255,255,0.4);
      transform: skewX(-20deg);
      transition: 0.7s;
    }

    .robux-button:hover::before {
      left: 140%;
    }

    /* PULSE */

    @keyframes pulse {
      0% {
        box-shadow:
          0 0 10px white,
          0 0 25px rgba(255,255,255,0.5);
      }

      50% {
        box-shadow:
          0 0 30px white,
          0 0 70px rgba(255,255,255,0.8);
      }

      100% {
        box-shadow:
          0 0 10px white,
          0 0 25px rgba(255,255,255,0.5);
      }
    }

    /* SCREENS */

    .definition-screen {
      opacity: 0;
      position: absolute;
      text-align: center;
      width: 80%;
      transition: opacity 2s ease;
      pointer-events: none;
    }

    .definition-screen.show {
      opacity: 1;
      pointer-events: auto;
      animation: fadeIn 2s ease;
    }

    .definition-title {
      font-size: 70px;
      margin-bottom: 20px;
      text-shadow:
        0 0 10px white,
        0 0 30px white;
      letter-spacing: 4px;
    }

    .definition-text {
      font-size: 30px;
      max-width: 900px;
      margin: auto;
      line-height: 1.5;
      text-shadow:
        0 0 10px black,
        0 0 20px black;
    }

    /* FLOATING PARTICLES */

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.4;
      animation: float linear infinite;
      z-index: 0;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
      }

      to {
        transform: translateY(-100vh);
      }
    }

    /* FADE */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

<body>

  <!-- VIDEO -->
  <video autoplay muted loop id="bgVideo">
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- START SCREEN -->
  <div class="container" id="startScreen">

    <button class="robux-button" onclick="showDefinition()">
      CLICK HERE FOR FREE ROBUX
    </button>

  </div>

  <!-- SECOND SCREEN -->
  <div class="definition-screen" id="definitionScreen">

    <div class="definition-text"
      style="font-size: 55px; margin-bottom: 40px;">

      THANKS FOR YOUR IP LOSER XDDD

    </div>

    <button class="robux-button"
      style="font-size: 28px; padding: 20px 50px;"
      onclick="showMoreInfo()">

      CLICK HERE FOR MORE INFO

    </button>

  </div>

  <!-- FINAL SCREEN -->
  <div class="definition-screen" id="finalScreen">

    <div class="definition-text">

      <br>

      <h1 class="definition-title">
        <strong>I OWN ALL YOU BITCHES</strong>
      </h1>

      <br>

      <h3>
        Means that you are superior to a group of others,
        in control, the boss, etc.
      </h3>

    </div>

  </div>

  <!-- AUDIO -->

  <audio id="bgMusic" autoplay loop style="display:none;">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>

    /* SCREEN SWITCHING */

    function showDefinition() {

      document.getElementById("startScreen").style.display = "none";

      document.getElementById("definitionScreen")
        .classList.add("show");
    }

    function showMoreInfo() {

      document.getElementById("definitionScreen")
        .style.display = "none";

      document.getElementById("finalScreen")
        .classList.add("show");
    }

    /* AUDIO */

    document.addEventListener("click", () => {

      document.getElementById("bgMusic").play();

    }, { once: true });

    /* PARTICLES */

    for (let i = 0; i < 90; i++) {

      let particle = document.createElement("div");

      particle.classList.add("particle");

      particle.style.left = Math.random() * 100 + "vw";

      particle.style.animationDuration =
        (5 + Math.random() * 10) + "s";

      particle.style.opacity = Math.random();

      document.body.appendChild(particle);
    }

  </script>

</body>
</html>
