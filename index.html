<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stormy Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: black;
      overflow: hidden;
      height: 100vh;
      color: white;
    }

    /* KEEPING YOUR BACKGROUND */

    body::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 2px,
        transparent 2px,
        transparent 40px
      );
      z-index: -1;
    }

    #bgVideo {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -2;
    }

    /* INTRO SCREEN */

    .intro {
      position: absolute;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 5;
      transition: 1.5s ease;
      backdrop-filter: blur(2px);
    }

    .intro.hide {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }

    .welcome {
      font-size: 7rem;
      letter-spacing: 15px;
      margin-bottom: 20px;
      text-shadow: 0 0 25px white;
      animation: fadeIn 2s ease;
    }

    .subtext {
      color: #ccc;
      margin-bottom: 40px;
      letter-spacing: 4px;
      font-size: 1.1rem;
      animation: fadeIn 3s ease;
    }

    .main-button {
      background: white;
      color: black;
      border: none;
      padding: 25px 60px;
      font-size: 28px;
      font-weight: bold;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 0 30px white;
      transition: 0.35s ease;
      animation: pulse 2s infinite;
    }

    .main-button:hover {
      transform: scale(1.08);
      background: black;
      color: white;
      border: 2px solid white;
    }

    /* GALLERY */

    .gallery {
      width: 100%;
      height: 100vh;
      position: absolute;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .gallery.show {
      opacity: 1;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.1);
      transition: opacity 1.5s ease, transform 6s ease;
      filter: grayscale(100%);
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
    }

    /* DARK OVERLAY */

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0.2)
      );
      z-index: 2;
    }

    /* COOL LITTLE TWIST */

    .floating-text {
      position: absolute;
      bottom: 40px;
      left: 40px;
      z-index: 3;
      font-size: 2rem;
      letter-spacing: 5px;
      text-shadow: 0 0 15px white;
      animation: glow 3s infinite alternate;
    }

    /* PARTICLES */

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: float linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(-100vh);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px white;
      }
      to {
        text-shadow: 0 0 20px white;
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 15px white;
      }
      50% {
        box-shadow: 0 0 40px white;
      }
      100% {
        box-shadow: 0 0 15px white;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

<body>

  <!-- KEEPING YOUR VIDEO -->
  <video autoplay muted loop id="bgVideo">
    <source src="background.mp4" type="video/mp4">
  </video>

  <!-- INTRO -->
  <div class="intro" id="introScreen">

    <div class="welcome">WELCOME</div>

    <div class="subtext">
      click below for stormys pictures
    </div>

    <button class="main-button" onclick="startGallery()">
      CLICK HERE
    </button>

  </div>

  <!-- GALLERY -->
  <div class="gallery" id="gallery">

    <div class="overlay"></div>

    <div class="floating-text">
      STORMY
    </div>

    <!-- REPLACE THESE WITH YOUR OWN IMAGES -->

    <img class="slide active" src="image1.jpg">
    <img class="slide" src="image2.jpg">
    <img class="slide" src="image3.jpg">
    <img class="slide" src="image4.jpg">
    <img class="slide" src="image5.jpg">

  </div>

  <!-- KEEPING YOUR AUDIO -->
  <audio id="bgMusic" autoplay loop style="display:none;">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>

    /* AUDIO */

    document.addEventListener("click", () => {
      document.getElementById("bgMusic").play();
    }, { once: true });

    /* SLIDESHOW */

    const intro = document.getElementById("introScreen");
    const gallery = document.getElementById("gallery");
    const slides = document.querySelectorAll(".slide");

    let current = 0;

    function startGallery() {

      intro.classList.add("hide");

      setTimeout(() => {
        gallery.classList.add("show");
      }, 800);

      setInterval(nextSlide, 4500);
    }

    function nextSlide() {

      slides[current].classList.remove("active");

      current = (current + 1) % slides.length;

      slides[current].classList.add("active");
    }

    /* PARTICLES */

    for (let i = 0; i < 80; i++) {

      let particle = document.createElement("div");

      particle.classList.add("particle");

      particle.style.left = Math.random() * 100 + "vw";

      particle.style.animationDuration =
        (5 + Math.random() * 10) + "s";

      particle.style.opacity = Math.random();

      document.body.appendChild(particle);
    }

  </script>

</body>
</html>
